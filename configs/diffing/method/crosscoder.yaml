# @package diffing.method
name: crosscoder
requires_preprocessing: true

# Training parameters - inherits data config from preprocessing
training:
  expansion_factor: 4
  batch_size: 256
  epochs: 1
  lr: 5e-4
  max_steps: null  # Auto-calculate from dataset size
  validate_every_n_steps: 200
  mu: 1e-1  # L1 penalty for ReLU type
  k: 20    # Sparsity for batch-top-k type; target L0 ~15 per Anna Soligo's observed L0 14-17
  k_max: 40  # ~2x k; Anna's JumpReLU equivalent had L0 14-17 so ceiling of 40 is reasonable
  k_annealing_steps: 2000
  auxk_alpha: 0.03125  # 1/32; empirically validated for BatchTopK
  dead_feature_threshold: 60_000  # tokens since last fire; 60k per user config

  # Data configuration
  num_samples: 5_000_000
  num_validation_samples: 10_000
  local_shuffling: true
  local_shuffling_shard_size: 500_000
  use_test_as_val: false
  workers: 0

  overwrite: true

datasets:
  use_chat_dataset: false
  use_pretraining_dataset: false
  use_training_dataset: true
  normalization:
    enabled: True
    subsample_size: 1_000_000
    batch_size: 4096
    cache_dir: "${infrastructure.storage.base_dir}/normalizer_cache"
    target_rms: 100.0

# Model configuration
model:
  type: "batch-top-k"  # ["relu", "batch-top-k"]
  code_normalization: "crosscoder"  # ["crosscoder", "sae", "mixed", "decoupled", "none"]
  same_init_for_all_layers: true
  norm_init_scale: 0.05
  init_with_transpose: true

# Training optimization
optimization:
  resample_steps: null
  warmup_steps: 200

layers: null  # Fraction of model layers to train on, if null, train on all available layers. Provide list of rays to train on.

# Analysis configuration
analysis:
  enabled: true

  latent_scaling:
    enabled: true
    dataset_split: "train"
    targets: ["base_error", "ft_error", "base_reconstruction", "ft_reconstruction", "base_activation", "ft_activation"]
    num_samples: 50_000
    batch_size: 128
    num_workers: 0
    device: "cuda"
    dtype: "float32"
    num_effective_ft_only_latents: 500
    overwrite: false

  latent_activations: # Collect latent activations for all datasets and layers
    enabled: true
    split: "train"
    overwrite: false # Overwrite existing latent activations and max activations
    upload_to_hub: false # Upload max activations to hub
    n_max_activations: 20 # Number of max activations to collect
    min_threshold: 1e-4 # Minimum activation threshold to consider
    max_num_samples: 5000 # Maximum number of samples to collect per dataset
    cache_device: "cuda"

  latent_steering:
    enabled: false
    overwrite: false
    prompts_file: "resources/steering_prompts_closed.txt"
    target_column: "dec_norm_diff"
    k: 10
    largest: false
    max_new_tokens: 512
    temperature: 1.0
    do_sample: false
    device: "cuda"
    use_chat_formatting: true
    enable_thinking: false
    steering_factors_percentages: [-0.5, 0.5, 0.8, 1.0, 1.5] # of max_activation
    steering_modes: ["all_tokens", "prompt_only"]

upload:
  model: false
