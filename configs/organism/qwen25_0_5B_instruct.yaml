# @package organism
name: qwen25_0_5B_instruct
description: Qwen2.5-0.5B-Instruct vs Qwen2.5-0.5B base
description_long: |
  Diff between the Qwen2.5-0.5B base pretrained model and its instruction-tuned
  variant (Qwen2.5-0.5B-Instruct). The instruct model is a full finetune of the
  base model on chat/instruction data.
finetuned_models:
  qwen25_0_5B:                        # must match the model config `name`
    default:
      model_id: Qwen/Qwen2.5-0.5B-Instruct
dataset:
  id: science-of-finetuning/fineweb-1m-sample
  splits: [train, validation]
  is_chat: false
  text_column: text
